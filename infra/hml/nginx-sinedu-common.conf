# Comum aos sites do Sinedu: tamanho de upload (planilhas e anexos até 10 MB), cache e cabeçalhos.
client_max_body_size 12m;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# index.html nunca em cache (troca de versão); assets com hash podem ficar.
location = /index.html { add_header Cache-Control "no-store" always; }
location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
