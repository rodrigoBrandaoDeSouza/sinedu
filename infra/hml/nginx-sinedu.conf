# Sinedu (homologação) no Nginx que já existe na VPS. Só nomes *.sinedu.bsuite.tech; os outros sites não são tocados.
# Fronts estáticos em /opt/sinedu/www/{conta,painel,web}; APIs em 127.0.0.1:5100 (plataforma) e :5200 (escolas).
# Certificado: /etc/letsencrypt/live/sinedu.bsuite.tech (Certbot webroot, nomes explícitos — add-host-cert.sh).

map $http_upgrade $sinedu_connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP: só o desafio do Let's Encrypt; o resto vai para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sinedu.bsuite.tech *.sinedu.bsuite.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name conta.sinedu.bsuite.tech;
    include /opt/sinedu/hml/nginx-sinedu-tls.conf;
    root /opt/sinedu/www/conta;
    include /opt/sinedu/hml/nginx-sinedu-common.conf;

    location ~ ^/(api|connect|\.well-known)(/|$) {
        proxy_pass http://127.0.0.1:5100;
        include /opt/sinedu/hml/nginx-sinedu-proxy.conf;
    }
    location / { try_files $uri /index.html; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name painel.sinedu.bsuite.tech;
    include /opt/sinedu/hml/nginx-sinedu-tls.conf;
    root /opt/sinedu/www/painel;
    include /opt/sinedu/hml/nginx-sinedu-common.conf;

    location ~ ^/(api|auth|signin-oidc|signout-callback-oidc)(/|$) {
        proxy_pass http://127.0.0.1:5100;
        include /opt/sinedu/hml/nginx-sinedu-proxy.conf;
    }
    location / { try_files $uri /index.html; }
}

# Mailpit (e-mails da homologação), com senha.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.sinedu.bsuite.tech;
    include /opt/sinedu/hml/nginx-sinedu-tls.conf;
    auth_basic "Sinedu - e-mails de homologacao";
    auth_basic_user_file /etc/nginx/sinedu-mailpit.htpasswd;   # fora de secrets/ (700), legível só pelo grupo www-data

    location / {
        proxy_pass http://127.0.0.1:8125;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sinedu_connection_upgrade;
    }
}

# Escolas: qualquer outro subdomínio (nomes exatos acima têm prioridade).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.sinedu.bsuite.tech;
    include /opt/sinedu/hml/nginx-sinedu-tls.conf;
    root /opt/sinedu/www/web;
    include /opt/sinedu/hml/nginx-sinedu-common.conf;

    location ~ ^/(api|auth|signin-oidc|signout-callback-oidc)(/|$) {
        proxy_pass http://127.0.0.1:5200;
        include /opt/sinedu/hml/nginx-sinedu-proxy.conf;
    }
    location / { try_files $uri /index.html; }
}
