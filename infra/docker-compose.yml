# Infraestrutura LOCAL de desenvolvimento do Sinedu.
# Credenciais abaixo são apenas para desenvolvimento — nunca reutilizar em homologação/produção.
# Uso: docker compose -f infra/docker-compose.yml up -d

name: sinedu

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinedu-dev}
      POSTGRES_DB: sinedu_platform
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sinedu_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-sinedu}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sinedu-dev}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 10
    ports:
      - "127.0.0.1:6432:5432"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # interface web: http://localhost:8025

  storage:
    # Object storage compatível com S3 (anexos). Um bucket por escola.
    image: chrislusf/seaweedfs:3.99
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports:
      - "127.0.0.1:8333:8333" # API S3
    volumes:
      - storage-data:/data
      - ./storage/s3.dev.json:/etc/seaweedfs/s3.json:ro

  vault:
    image: hashicorp/vault:1.20
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-init:
    # Configura engines e políticas do Vault (idempotente). Roda e termina.
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
    volumes:
      - ./vault:/vault-config:ro
    entrypoint: ["/bin/sh", "/vault-config/bootstrap.sh"]
    restart: "no"

volumes:
  postgres-data:
  storage-data:
